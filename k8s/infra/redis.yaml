# Redis: link cache and rate-limit counters. Losing the data is harmless, so no storage is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: clicktrail
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: clicktrail
        app.kubernetes.io/component: cache
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: clicktrail
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
