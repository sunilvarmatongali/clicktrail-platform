# Network rules ("who may talk to whom"), following the principle of least privilege.
#
# NOTE: a NetworkPolicy only works if the cluster's network plugin enforces it (Calico, Cilium, Amazon VPC CNI
# with policy support, ...). The default kind network plugin ignores these rules, so they have no effect on kind.
# They are included because they are part of a production-style setup, and they are validated for correctness in CI.

# 1. Start from "nobody may connect to anything in this namespace".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: clicktrail
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. The gateway is the only pod that accepts traffic from outside the cluster (port 8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-to-gateway
  namespace: clicktrail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
---
# 3. Only the gateway may call the auth, URL and analytics services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: clicktrail
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [auth-service, url-service, analytics-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
---
# 4. Services may reach their own data stores, and Prometheus may scrape every application.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-data-stores
  namespace: clicktrail
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [database, cache, messaging]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-init
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: clicktrail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: application
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
# 5. Grafana may query Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: clicktrail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
