apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: clicktrail
    app.kubernetes.io/component: application
spec:
  # One replica on purpose: the Kafka topic has 3 partitions, so up to 3 replicas could share the work
  # (they join the same consumer group). Start with one and scale when consumer lag grows.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: clicktrail
        app.kubernetes.io/component: application
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-service
          image: ghcr.io/sunilvarmatongali/clicktrail-analytics-service:0.1.0
          ports:
            - name: grpc
              containerPort: 9083
            - name: ops
              containerPort: 8083
          env:
            - name: ANALYTICS_HTTP_PORT
              value: "8083"
            - name: ANALYTICS_GRPC_PORT
              value: "9083"
            - name: ANALYTICS_MONGODB_URI
              value: mongodb://mongo:27017
            - name: ANALYTICS_KAFKA_BROKERS
              value: kafka:9092
            - name: ANALYTICS_KAFKA_TOPIC
              value: clicktrail.link-clicked.v1
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: clicktrail
spec:
  type: ClusterIP # reachable only inside the cluster
  selector:
    app.kubernetes.io/name: analytics-service
  ports:
    - name: grpc
      port: 9083
      targetPort: grpc
    - name: ops
      port: 8083
      targetPort: ops
