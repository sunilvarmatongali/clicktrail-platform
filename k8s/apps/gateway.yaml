apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: clicktrail
    app.kubernetes.io/component: application
spec:
  # The gateway keeps no state (rate-limit counters are in Redis), so it can run in several copies.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: clicktrail
        app.kubernetes.io/component: application
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/sunilvarmatongali/clicktrail-gateway:0.1.0
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 8090
          env:
            - name: GATEWAY_HTTP_PORT
              value: "8080"
            - name: GATEWAY_OPS_PORT
              value: "8090"
            - name: GATEWAY_AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: GATEWAY_URL_SERVICE_URL
              value: http://url-service:8082
            - name: GATEWAY_ANALYTICS_GRPC_ADDRESS
              value: analytics-service:9083
            - name: GATEWAY_REDIS_ADDRESS
              value: redis:6379
            - name: GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: clicktrail-secrets, key: jwt-secret }
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Keeps at least one gateway running during node maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: clicktrail
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
# The public entry point. NodePort 30080 is mapped to localhost:8080 by the kind cluster config.
# On a cloud cluster you would use a LoadBalancer or an Ingress with TLS instead.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: clicktrail
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: clicktrail
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
    - name: ops
      port: 8090
      targetPort: ops
