# Prometheus collects numbers from every service every 15 seconds.
# The same file is used by Docker Compose and Kubernetes because the service names are identical in both.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Gateway: the metrics live on the internal operations port (8090), not on the public port.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8090"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: url-service
    static_configs:
      - targets: ["url-service:8082"]

  # Analytics: HTTP operations port (the gRPC API is on 9083).
  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8083"]
