name: debug-oidc

# TEMPORARY: prints the (public) claims of the identity token this repository sends to AWS, to debug the role's trust policy.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show the claims AWS will see
        run: |
          TOKEN="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          # Only the middle part (the claims) is decoded and shown; the signature is never printed.
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{iss, aud, sub, repository, ref, job_workflow_ref}'
