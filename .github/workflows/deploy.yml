name: deploy

# Manual deployment of a released version to the EC2 VM.
#
# No SSH, no stored keys, no secrets, no IP addresses to maintain:
#   1. GitHub gives the job a short-lived identity token (OIDC). AWS trusts it and hands out temporary credentials for ONE
#      role. The role may only: upload to one S3 folder, run a command on ONE instance through AWS Systems Manager (SSM),
#      read the result, and look up that instance's public address.
#   2. The job packs the stack files, uploads them to S3 and sends a "deploy" command to the instance by its ID.
#      The instance downloads the files through a 10-minute download link, verifies their checksum and deploys.
#   3. The job checks the public address from outside.
#
# One-time setup: docs/aws-deploy-setup.md. Day-to-day use: docs/runbook.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, without the leading v (for example 0.1.0)"
        required: true
        type: string
      overrides:
        description: "Optional: other versions for single services, for example: gateway=0.1.1"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write # lets the job request the OIDC identity token (needed for the AWS role)

# Never run two deployments at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Not secret: identifiers only. Set as repository variables (Settings -> Secrets and variables -> Actions -> Variables).
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        env:
          VERSION: ${{ inputs.version }}
          OVERRIDES: ${{ inputs.overrides }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3"; exit 1; }
          # Free text is never trusted: only "service=1.2.3" words separated by spaces may pass.
          if [[ -n "$OVERRIDES" ]]; then
            [[ "$OVERRIDES" =~ ^((gateway|auth-service|url-service|analytics-service)=[0-9]+\.[0-9]+\.[0-9]+)( ((gateway|auth-service|url-service|analytics-service)=[0-9]+\.[0-9]+\.[0-9]+))*$ ]] \
              || { echo "overrides must look like: gateway=0.1.1 url-service=0.1.2"; exit 1; }
          fi
          for name in INSTANCE_ID DEPLOY_BUCKET; do
            [[ -n "${!name}" ]] || { echo "repository variable for ${name} is not set (see docs/aws-deploy-setup.md)"; exit 1; }
          done

      - name: Get temporary AWS credentials (OIDC, nothing stored)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: clicktrail-deploy-${{ github.run_id }}

      - name: Pack the stack files and upload them
        id: bundle
        run: |
          tar -czf "$RUNNER_TEMP/bundle.tgz" compose/docker-compose.yml compose/.env.example observability scripts
          SHA="$(sha256sum "$RUNNER_TEMP/bundle.tgz" | cut -d' ' -f1)"
          KEY="deploy/run-${GITHUB_RUN_ID}-${GITHUB_SHA}.tgz"
          aws s3 cp "$RUNNER_TEMP/bundle.tgz" "s3://${DEPLOY_BUCKET}/${KEY}" --only-show-errors
          # A download link that works for 10 minutes only, so the VM needs no S3 permissions of its own.
          URL="$(aws s3 presign "s3://${DEPLOY_BUCKET}/${KEY}" --expires-in 600)"
          echo "::add-mask::${URL}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy on the VM and run its smoke test (through SSM, no SSH)
        env:
          VERSION: ${{ inputs.version }}
          OVERRIDES: ${{ inputs.overrides }}
          BUNDLE_URL: ${{ steps.bundle.outputs.url }}
          BUNDLE_SHA: ${{ steps.bundle.outputs.sha }}
        run: |
          # jq builds the command list; "@sh" quotes the values safely. VERSION and OVERRIDES were validated above and
          # deploy.sh validates them again.
          jq -n --arg url "$BUNDLE_URL" --arg sha "$BUNDLE_SHA" --arg version "$VERSION" --arg overrides "$OVERRIDES" '{
            commands: [
              "set -euo pipefail",
              "curl -fsS -o /tmp/clicktrail-bundle.tgz \($url | @sh)",
              "echo \(($sha + "  /tmp/clicktrail-bundle.tgz") | @sh) | sha256sum -c -",
              "mkdir -p /opt/clicktrail",
              "tar -xzf /tmp/clicktrail-bundle.tgz -C /opt/clicktrail --no-same-owner",
              "rm -f /tmp/clicktrail-bundle.tgz",
              "chown -R ubuntu:ubuntu /opt/clicktrail",
              "chmod +x /opt/clicktrail/scripts/*.sh /opt/clicktrail/scripts/aws/*.sh",
              "sudo -u ubuntu -H bash /opt/clicktrail/scripts/aws/deploy.sh \($version) \($overrides)"
            ],
            executionTimeout: ["1800"]
          }' > "$RUNNER_TEMP/ssm-parameters.json"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "clicktrail deploy ${VERSION} (run ${GITHUB_RUN_ID})" \
            --parameters "file://${RUNNER_TEMP}/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: ${COMMAND_ID}"

          STATUS="Pending"
          for _ in $(seq 1 200); do
            sleep 10
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)"
            case "$STATUS" in
              Success | Failed | Cancelled | TimedOut | Cancelling | Undeliverable | Terminated) break ;;
            esac
          done

          echo "==== output from the VM ===="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "==== errors from the VM ===="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "Final status: ${STATUS}"
          [[ "$STATUS" == "Success" ]]

      - name: Smoke test from outside (public port only; internal ports must be closed)
        run: |
          PUBLIC_IP="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          [[ "$PUBLIC_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "the instance has no public address"; exit 1; }
          echo "Public address: ${PUBLIC_IP}"
          # No admin login is stored in GitHub, so the admin-only checks run inside the VM (see above), not here.
          PUBLIC_HOST="$PUBLIC_IP" scripts/smoke-test.sh "http://${PUBLIC_IP}:8080"
